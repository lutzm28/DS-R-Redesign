<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS+R — Home</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="home-page" data-page="home">
    <header class="home-navigation">
      <img src="assets/home-nav.svg" alt="DS+R" class="home-nav-art">
      <a class="home-menu-link" href="menu.html" aria-label="Open menu">
        <span aria-hidden="true"></span>
      </a>
    </header>

    <img src="assets/home-quote.svg" alt="We do everything differently" class="home-quote">

    <section class="home-projects" aria-label="Featured projects">
      <div class="home-projects-background" aria-hidden="true"></div>
      <img src="assets/home-highline.jpg" alt="Aerial view of the High Line" class="home-high-line" data-home-carousel="primary">
      <img src="assets/broad-expansion.png" alt="The Broad expansion" class="home-broad">
      <img src="assets/home-columbia.jpg" alt="Columbia University campus" class="home-museum" data-home-carousel="secondary">
      <button class="home-pagination home-pagination-highline" type="button" data-home-control="primary" aria-label="Show next featured project">
      </button>
      <button class="home-pagination home-pagination-museum" type="button" data-home-control="secondary" aria-label="Show next lower featured project">
      </button>
    </section>
  </main>
</body>
</html>
