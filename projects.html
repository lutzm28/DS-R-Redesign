<!doctype html>
<html lang="en">

      <nav class="project-categories" aria-label="Project categories">

        <a href="#public-space">Public Space</a>

        <a href="#display">Display</a>
        <a href="#objects">Objects</a>
        <a href="#performance">Performance</a>

      <div class="project-grid">
        <a class="project-card project-card-large" href="broad.html">

        </a>

      <a class="see-more" href="#more">See more</a>
      <nav class="pagination" aria-label="Project pages">
        <a href="#page-3">3</a>
        <a href="#page-2">2</a>
        <a class="active" href="#page-1">1</a>
      </nav>
    </section>

    <aside class="projects-rail" aria-label="DS+R menu controls">
      <a class="menu-vertical-link" href="menu.html" aria-label="Open menu">
        <img class="menu-vertical" src="assets/menu-vertical.svg" alt="">
      </a>
      <img class="side-name" src="assets/side-name.svg" alt="DS+R">
    </aside>
